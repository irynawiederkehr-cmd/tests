<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E4F3C">
<title>Нет интернета — Ирина Вознесенская</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F4EDE3;--paper:#FFFCF8;--ink:#2F2924;--muted:#7A6E62;--brown:#6E4F3C;--line:#E5D9C9}
@media (prefers-color-scheme: dark){:root{--bg:#221D19;--paper:#2C2621;--ink:#F1E9DF;--muted:#B4A796;--brown:#E1C2A6;--line:#3E362F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;padding:24px 16px}
.card{max-width:440px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px 24px;text-align:center}
img{width:76px;height:76px;border-radius:18px}
h1{font-family:"Forum",Georgia,serif;font-weight:400;font-size:2rem;margin:14px 0 8px}
p{color:var(--muted);line-height:1.55;margin:0 0 12px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:18px}
a,button{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;text-decoration:none;cursor:pointer}
button{background:var(--brown);color:var(--paper);border:0}
a{border:1.5px solid var(--brown);color:var(--brown)}
</style>
</head>
<body>
<main class="card">
  <img src="/icon-192.png" alt="">
  <h1 data-t="h">Нет интернета</h1>
  <p data-t="p1">Эта страница ещё не сохранялась на телефоне, поэтому без интернета её не открыть.</p>
  <p data-t="p2">Страницы, которые уже открывались на этом телефоне, работают и без сети. Твои ответы в тестах на месте.</p>
  <div class="btns">
    <button type="button" onclick="location.reload()" data-t="b1">Попробовать ещё раз</button>
    <a href="/" data-t="b2">На главную</a>
  </div>
</main>
<script>
(function(){
  var l = 'ru'; try { l = localStorage.getItem('irinaTestsLang') || 'ru'; } catch (e) {}
  var m = location.pathname.match(/^\/(uk|de|en)\//); if (m) l = m[1];
  var T = {
    uk: ['Немає інтернету — Ірина Вознесенська','Немає інтернету','Ця сторінка ще не зберігалася на телефоні, тому без інтернету її не відкрити.','Сторінки, які вже відкривалися на цьому телефоні, працюють і без мережі. Твої відповіді в тестах на місці.','Спробувати ще раз','На головну'],
    de: ['Kein Internet — Iryna Voznesenskaya','Kein Internet','Diese Seite wurde auf dem Telefon noch nicht gespeichert und lässt sich ohne Internet nicht öffnen.','Seiten, die auf diesem Telefon schon geöffnet wurden, funktionieren auch offline. Deine Antworten in den Tests bleiben erhalten.','Noch einmal versuchen','Zur Startseite'],
    en: ['No internet — Iryna Voznesenskaya','No internet','This page has not been saved on your phone yet, so it cannot open without internet.','Pages already opened on this phone work offline too. Your test answers are still there.','Try again','Go to home page']
  }[l];
  if (!T) return;
  document.documentElement.lang = l; document.title = T[0];
  ['h','p1','p2','b1','b2'].forEach(function(k,i){ document.querySelector('[data-t="'+k+'"]').textContent = T[i+1]; });
  document.querySelector('a[data-t="b2"]').href = '/' + l + '/';
})();
</script>
</body>
</html>
