<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена · Ирина Вознесенская</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root{--bg:#F4EDE3;--paper:#FFFCF8;--ink:#2F2924;--muted:#7A6E62;--brown:#6E4F3C;--sage:#4F5E3E}
@media (prefers-color-scheme: dark){:root{--bg:#221D19;--paper:#2C2621;--ink:#F1E9DF;--muted:#B4A796;--brown:#E1C2A6}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 Manrope,system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;text-align:center}
h1{font-family:Forum,Georgia,serif;font-weight:400;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.1;margin:0 0 14px}
p{color:var(--muted);margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{font-weight:700;text-decoration:none;border-radius:999px;padding:11px 20px}
.a1{background:var(--sage);color:#fff}
.a2{border:1.5px solid var(--brown);color:var(--brown)}
</style>
</head>
<body>
<main>
<h1>Такой страницы нет</h1>
<p>Возможно, ссылка устарела или в адресе опечатка. Начни с главной страницы или напиши мне в Telegram.</p>
<div class="row"><a class="a1" href="/">На главную</a><a class="a2" href="https://t.me/IrynaNeuroCoach">Написать в Telegram</a></div>
</main>
<script>(function(){
  var T = {
    uk: ['Сторінку не знайдено · Ірина Вознесенська', 'Такої сторінки немає', 'Можливо, посилання застаріло або в адресі помилка. Почни з головної сторінки або напиши мені в Telegram.', 'На головну', 'Написати в Telegram'],
    de: ['Seite nicht gefunden · Iryna Voznesenskaya', 'Diese Seite gibt es nicht', 'Vielleicht ist der Link veraltet oder die Adresse enthält einen Tippfehler. Fang auf der Startseite an oder schreib mir auf Telegram.', 'Zur Startseite', 'Auf Telegram schreiben'],
    en: ['Page not found · Iryna Voznesenskaya', 'This page doesn’t exist', 'The link may be out of date, or there may be a typo in the address. Start from the home page or message me on Telegram.', 'To the home page', 'Message me on Telegram']
  };
  var m = location.pathname.match(/^\/(uk|de|en)(\/|$)/), l = m && m[1];
  if (!l) { try { l = localStorage.getItem('irinaTestsLang'); } catch (e) {} }
  if (!T[l]) return;
  var t = T[l], a = document.querySelectorAll('.row a');
  document.documentElement.lang = l; document.title = t[0];
  document.querySelector('h1').textContent = t[1]; document.querySelector('main p').textContent = t[2];
  a[0].textContent = t[3]; a[0].setAttribute('href', '/' + l + '/'); a[1].textContent = t[4];
})();</script>
<script src="/assets/samesite.js"></script>
</body>
</html>
